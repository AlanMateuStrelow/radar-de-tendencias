name: Atualizar tendências

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 06:00 (horário de Brasília)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pytrends

      - name: Atualizar dados do Google Trends
        run: python scripts/atualizar_tendencias.py
        continue-on-error: true

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/produtos.json; then
            git add data/produtos.json
            git commit -m "Atualiza tendências de busca (automático)"
            git push
          else
            echo "Sem mudanças para publicar."
          fi
